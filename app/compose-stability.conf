// Classes the Compose compiler should treat as stable, so screens skip recomposing when they
// get an equal value. Everything listed is immutable by convention: data classes of vals,
// read-only collections that are never cast back and changed after they are built.

// The app's models: Room entities, settings and every domain result (domain/ holds only
// immutable data classes and stateless objects).
com.alexivanov.receiptvault.data.Receipt
com.alexivanov.receiptvault.data.LineItem
com.alexivanov.receiptvault.data.AppSettings
com.alexivanov.receiptvault.domain.*

// Read-only Kotlin collections and java.time values.
kotlin.collections.*
java.time.*
