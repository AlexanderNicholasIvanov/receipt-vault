name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          # AGP downloads the platform and build-tools it needs on its own.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      # Robolectric downloads its Android runtime jar from Maven Central on first use.
      # A network blip there failed a main build once; keep the jar between runs.
      - name: Cache Robolectric runtime
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-
      - name: Lint, unit tests, debug APK
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug
      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: receipt-vault-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
