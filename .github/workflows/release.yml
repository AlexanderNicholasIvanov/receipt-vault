name: release

# Every push to main publishes a signed APK as a GitHub Release. Phones
# download it from
#   https://github.com/<owner>/<repo>/releases/latest/download/ReceiptVault.apk
# and the app itself checks the latest release and offers the update.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

# Actions are pinned to commits: a moved tag can't change what runs next to the signing key.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # versionCode must strictly increase for Android to accept an update;
  # the workflow run number does that for free.
  VERSION_CODE: ${{ github.run_number }}

jobs:
  # Runs the third-party actions and the build, so it gets no secrets and a read-only token.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Test and build unsigned release APK
        run: |
          ./gradlew --no-daemon \
            -Preceiptvault.versionCode="$VERSION_CODE" \
            -Preceiptvault.updateRepo="$GITHUB_REPOSITORY" \
            -Preceiptvault.unsignedRelease=true \
            testDebugUnitTest assembleRelease

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  # The only job with the signing key and a token that can publish. It runs no build
  # and no third-party code, only GitHub's artifact download and the runner's own tools.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: unsigned-apk
          path: ${{ runner.temp }}/unsigned

      - name: Sign the APK
        env:
          RV_KEYSTORE_B64: ${{ secrets.RV_KEYSTORE_B64 }}
          RV_KEYSTORE_PASSWORD: ${{ secrets.RV_KEYSTORE_PASSWORD }}
          RV_KEY_ALIAS: ${{ secrets.RV_KEY_ALIAS }}
          RV_KEY_PASSWORD: ${{ secrets.RV_KEY_PASSWORD }}
        run: |
          if [ -z "$RV_KEYSTORE_B64" ]; then
            echo "::error::RV_KEYSTORE_B64 secret is missing; refusing to publish an unsigned release."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          echo "$RV_KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" --ks-pass env:RV_KEYSTORE_PASSWORD \
            --ks-key-alias "$RV_KEY_ALIAS" --key-pass env:RV_KEY_PASSWORD \
            --out "$RUNNER_TEMP/ReceiptVault.apk" \
            "$RUNNER_TEMP/unsigned/app-release-unsigned.apk"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/ReceiptVault.apk" | tee "$RUNNER_TEMP/certs.txt"
          # Fail loudly if the APK somehow ended up debug-signed.
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then echo "::error::APK is debug-signed"; exit 1; fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${VERSION_CODE}"
          NOTES="Receipt Vault ${TAG} (${GITHUB_SHA::7}).

          version_code: ${VERSION_CODE}

          **Install on your phone:** open this page on the phone, tap **ReceiptVault.apk**, then open the download. If asked, allow your browser to install unknown apps. Updates install over the previous version because every build is signed with the same key."
          gh release create "$TAG" "$RUNNER_TEMP/ReceiptVault.apk" \
            --repo "$GITHUB_REPOSITORY" --title "Receipt Vault ${TAG}" --notes "$NOTES" --latest
